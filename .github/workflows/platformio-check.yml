name: PlatformIO Build Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test telemetry contract checker
        run: python -m unittest discover -s tests -v

      - name: Validate telemetry contract
        run: python scripts/check_telemetry_contract.py

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Build firmware
        run: pio run
